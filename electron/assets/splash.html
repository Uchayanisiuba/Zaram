<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
    <title>Zaram</title>
    <!--
      The mark, breathing, while the engine starts — the same rounded-square
      Z the app shows in its corner and the site in its nav, so the first
      thing seen is the thing the icon is. No spinner: the breath is the
      wait. Sandboxed, so nothing is fetched; the mark is inline.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0b14;
        color: #e7e7f5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        user-select: none;
        overflow: hidden;
      }
      /* The mark as it appears in the app's corner and on the site's nav:
         the Z on a rounded square, breathing at the landing's pace. */
      .tile {
        width: 112px; height: 112px;
        border-radius: 28px;
        display: grid; place-items: center;
        background: linear-gradient(160deg, #1b1a3a 0%, #121228 100%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.07),
          0 0 0 1px rgba(255,255,255,0.06),
          0 18px 40px -18px rgba(0,0,0,0.9),
          0 0 40px -10px rgba(99,102,241,0.45);
        animation: breathe 8s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .sub { font-size: 13px; opacity: 0.6; letter-spacing: 0.02em; }
      @media (prefers-reduced-motion: reduce) {
        .tile { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="tile" aria-hidden="true">
      <svg viewBox="0 0 130.73 100" width="64" height="49">
        <defs>
          <linearGradient id="zaram-tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#A853E2" />
            <stop offset="100%" stop-color="#4BADE6" />
          </linearGradient>
        </defs>
        <g fill="url(#zaram-tile)">
          <polygon points="31.84,0.0 130.17,0.56 83.8,62.01 64.25,62.01 94.41,20.11 17.32,19.55" />
          <polygon points="46.93,37.43 67.04,37.43 36.31,79.89 94.41,79.89 108.38,62.57 130.17,62.57 102.23,99.44 0.0,99.44" />
        </g>
      </svg>
    </div>
    <div class="sub">Starting&hellip;</div>
  </body>
</html>
