    <style id="theme-vars">
:root {
  color-scheme: light dark;

  --zaram-primary-50: #f4f4ff;
  --zaram-primary-100: #e9e8ff;
  --zaram-primary-200: #d1ceff;
  --zaram-primary-300: #b2acff;
  --zaram-primary-400: #9487ff;
  --zaram-primary-500: #7c6bff;
  --zaram-primary-600: #6652f5;
  --zaram-primary-700: #5140d4;
  --zaram-primary-800: #4035a6;
  --zaram-primary-900: #2a2468;

  --zaram-neutral-0: #ffffff;
  --zaram-neutral-50: #f7f8fc;
  --zaram-neutral-100: #eef1f7;
  --zaram-neutral-200: #d9deeb;
  --zaram-neutral-300: #b9c0d3;
  --zaram-neutral-400: #8791ab;
  --zaram-neutral-500: #5d6783;
  --zaram-neutral-600: #434c66;
  --zaram-neutral-700: #2d3447;
  --zaram-neutral-800: #1c2231;
  --zaram-neutral-900: #111522;
  --zaram-neutral-950: #090c14;

  --state-success: #37c790;
  --state-warning: #f1b85b;
  --state-error: #f26d78;
  --state-info: #6f8cff;

  --zaram-background: #f7f8fc;
  --zaram-foreground: #111522;
  --zaram-card: rgba(255, 255, 255, 0.88);
  --zaram-card-foreground: #111522;
  --zaram-popover: rgba(255, 255, 255, 0.96);
  --zaram-popover-foreground: #111522;
  --zaram-primary: var(--zaram-primary-600);
  --zaram-primary-foreground: #ffffff;
  --zaram-muted: rgba(93, 103, 131, 0.12);
  --zaram-muted-foreground: #5d6783;
  --zaram-border: rgba(67, 76, 102, 0.16);
  --zaram-input: rgba(67, 76, 102, 0.12);
  --zaram-ring: rgba(124, 107, 255, 0.42);

  --zaram-surface-1: rgba(255, 255, 255, 0.82);
  --zaram-surface-2: rgba(247, 248, 252, 0.92);
  --zaram-surface-3: rgba(238, 241, 247, 0.96);
  --zaram-panel-blur: 20px;
  --zaram-static-shadow: 0 20px 48px rgba(9, 12, 20, 0.04);
  --zaram-floating-shadow: 0 24px 80px rgba(9, 12, 20, 0.12);

  --zaram-radius-small: 4px;
  --zaram-radius-medium: 10px;
  --zaram-radius-large: 16px;
  --zaram-radius-sm: 4px;
  --zaram-radius-md: 8px;
  --zaram-radius-lg: 16px;
  --zaram-radius-full: 9999px;

  --background: var(--zaram-background);
  --foreground: var(--zaram-foreground);
  --card: var(--zaram-card);
  --card-foreground: var(--zaram-card-foreground);
  --popover: var(--zaram-popover);
  --popover-foreground: var(--zaram-popover-foreground);
  --primary: var(--zaram-primary);
  --primary-foreground: var(--zaram-primary-foreground);
  --muted: var(--zaram-muted);
  --muted-foreground: var(--zaram-muted-foreground);
  --border: var(--zaram-border);
  --input: var(--zaram-input);
  --ring: var(--zaram-ring);

  --color-background: var(--zaram-background);
  --color-foreground: var(--zaram-foreground);
  --color-card: var(--zaram-card);
  --color-card-foreground: var(--zaram-card-foreground);
  --color-popover: var(--zaram-popover);
  --color-popover-foreground: var(--zaram-popover-foreground);
  --color-primary: var(--zaram-primary);
  --color-primary-foreground: var(--zaram-primary-foreground);
  --color-muted: var(--zaram-muted);
  --color-muted-foreground: var(--zaram-muted-foreground);
  --color-border: var(--zaram-border);
  --color-input: var(--zaram-input);
  --color-ring: var(--zaram-ring);
  --radius-small: var(--zaram-radius-small);
  --radius-medium: var(--zaram-radius-medium);
  --radius-large: var(--zaram-radius-large);
}

.dark {
  --zaram-background: #060913;
  --zaram-foreground: #edf1ff;
  --zaram-card: rgba(10, 14, 28, 0.72);
  --zaram-card-foreground: #edf1ff;
  --zaram-popover: rgba(8, 12, 24, 0.9);
  --zaram-popover-foreground: #edf1ff;
  --zaram-primary: #8b7bff;
  --zaram-primary-foreground: #f8f8ff;
  --zaram-muted: rgba(137, 146, 172, 0.12);
  --zaram-muted-foreground: #99a4c2;
  --zaram-border: rgba(146, 155, 184, 0.14);
  --zaram-input: rgba(146, 155, 184, 0.12);
  --zaram-ring: rgba(139, 123, 255, 0.48);

  --zaram-surface-1: rgba(12, 17, 32, 0.78);
  --zaram-surface-2: rgba(11, 17, 29, 0.88);
  --zaram-surface-3: rgba(15, 22, 40, 0.96);
  --zaram-static-shadow: 0 22px 56px rgba(2, 4, 10, 0.05);
  --zaram-floating-shadow: 0 28px 100px rgba(2, 4, 10, 0.18);

  --background: var(--zaram-background);
  --foreground: var(--zaram-foreground);
  --card: var(--zaram-card);
  --card-foreground: var(--zaram-card-foreground);
  --popover: var(--zaram-popover);
  --popover-foreground: var(--zaram-popover-foreground);
  --primary: var(--zaram-primary);
  --primary-foreground: var(--zaram-primary-foreground);
  --muted: var(--zaram-muted);
  --muted-foreground: var(--zaram-muted-foreground);
  --border: var(--zaram-border);
  --input: var(--zaram-input);
  --ring: var(--zaram-ring);

  --color-background: var(--zaram-background);
  --color-foreground: var(--zaram-foreground);
  --color-card: var(--zaram-card);
  --color-card-foreground: var(--zaram-card-foreground);
  --color-popover: var(--zaram-popover);
  --color-popover-foreground: var(--zaram-popover-foreground);
  --color-primary: var(--zaram-primary);
  --color-primary-foreground: var(--zaram-primary-foreground);
  --color-muted: var(--zaram-muted);
  --color-muted-foreground: var(--zaram-muted-foreground);
  --color-border: var(--zaram-border);
  --color-input: var(--zaram-input);
  --color-ring: var(--zaram-ring);
}

body {
  font-family: Inter, "SF Pro Display", "Segoe UI", sans-serif;
}

.zaram-display {
  font-family: Inter, "SF Pro Display", "Segoe UI", sans-serif;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.zaram-h1 {
  font-family: Inter, "SF Pro Display", "Segoe UI", sans-serif;
  font-size: 2rem;
  line-height: 1.05;
  font-weight: 600;
  letter-spacing: -0.04em;
}

.zaram-h2 {
  font-family: Inter, "SF Pro Display", "Segoe UI", sans-serif;
  font-size: 1.375rem;
  line-height: 1.15;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.zaram-h3 {
  font-family: Inter, "SF Pro Display", "Segoe UI", sans-serif;
  font-size: 1rem;
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.zaram-body {
  font-family: Inter, "SF Pro Text", "Segoe UI", sans-serif;
  font-size: 0.9375rem;
  line-height: 1.6;
  font-weight: 400;
}

.zaram-body-sm {
  font-family: Inter, "SF Pro Text", "Segoe UI", sans-serif;
  font-size: 0.8125rem;
  line-height: 1.5;
  font-weight: 400;
}

    --color-background: var(--zaram-background);
    --color-foreground: var(--zaram-foreground);
    --color-card: var(--zaram-card);
    --color-card-foreground: var(--zaram-card-foreground);
    --color-popover: var(--zaram-popover);
    --color-popover-foreground: var(--zaram-popover-foreground);
    --color-primary: var(--zaram-primary);

    --color-muted: var(--zaram-muted);
    --color-muted-foreground: var(--zaram-muted-foreground);
    --color-border: var(--zaram-border);
    --color-input: var(--zaram-input);
    --color-ring: var(--zaram-ring);
    --radius-sm: var(--zaram-radius-sm);
    --radius-md: var(--zaram-radius-md);
    --radius-lg: var(--zaram-radius-lg);
  }
  @layer base {
    body { background: var(--zaram-background); color: var(--zaram-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
