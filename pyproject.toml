[project]
name = "zaram"
version = "0.1.0"
description = "The memory and control layer for people who use more than one AI"
requires-python = ">=3.11"

# Voice is an optional extra, not part of the base install.
#
# Kokoro drags torch, transformers and the spaCy stack — roughly 830 MB, most of
# the installed backend — for a feature that is out of scope for v1. The chat
# path imports none of it, and the provider already degrades cleanly when the
# import fails, so making it optional costs nothing but packaging metadata.
#
# The pinned set lives in backend/requirements-voice.txt. It is not duplicated
# here, because two hand-maintained lists of the same 47 packages would drift.
#
#     pip install -r backend/requirements-voice.txt
#     python -m spacy download en_core_web_sm
[project.optional-dependencies]
voice = []

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"] # Let the formatter handle line length

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["venv", "node_modules", "frontend"]

[tool.pytest.ini_options]
# Collect the whole backend, not a hand-listed set of directories. An allow-list
# silently hides any test dir nobody remembered to add: `backend/tests` alone left
# garage, media, voice and presence uncollected, so every suite count quoted before
# 2026-08-04 was wrong. Excluding is safe (a stale exclusion collects extra tests);
# including is not (a missing entry hides them).
testpaths = ["backend"]
norecursedirs = [
    "venv",
    ".venv",
    "node_modules",
    "__pycache__",
    "*.egg-info",
    # Runtime scratch dirs — data, never tests.
    "audio",
    "audio_cache",
    "audio_clips",
    "audio_output",
    "image_output",
    "temp",
    "uploads",
]
# Manual smoke scripts from early kernel work: `asyncio.run(main())` at import time,
# no test functions, and test_kernel.py does not currently parse. They match test_*.py
# by accident. Delete or rename these to manual_*.py and drop these lines.
# Two test files may share a basename. Under the default "prepend" import mode
# they may not: `providers/tests/test_manager.py` and `media/tests/test_manager.py`
# both become the top-level module `test_manager` and the second one collected
# fails with "import file mismatch". That is a packaging accident, not a naming
# rule worth obeying, and it only appeared once collection widened past one
# directory. importlib mode derives the module name from the full path.
addopts = """-v --tb=short --import-mode=importlib
    --ignore=backend/test_kernel.py
    --ignore=backend/test_models_runtime.py
    --ignore=backend/test_execution_engine.py
    --ignore=backend/core/test_execution_engine.py"""
asyncio_mode = "auto"